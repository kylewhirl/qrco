version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      app-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /apps/docs
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      docs-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
